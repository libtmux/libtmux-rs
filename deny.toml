# cargo-deny gates what the dependency tree is allowed to contain.
#
# Run it with `just deny`.

[graph]
all-features = true

[licenses]
# Every license the tree carries today, all permissive. A dependency arriving
# under anything else stops the build rather than quietly changing what
# downstream users are agreeing to.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
[bans]
multiple-versions = "warn"
# A path dependency inside this workspace carries no version by design: the
# consumer crates are publish = false. Everything from a registry must be
# pinned to a range.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# `chrono` reaches the tree only through `rmcp`, which depends on it
# unconditionally and enables the `chrono04` feature of `schemars`; no
# `rmcp` release up to 3.11.0 has a feature that drops it. Remove this entry
# once an `rmcp` release moves to `jiff` or `time` (or makes `chrono`
# optional) and `tmux-mcp` requires that release.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no patched version; a dependency of rmcp, which has no release without it yet" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
