[package]
name = "libtmux-macros"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for libtmux filter expressions (alpha)"
documentation = "https://docs.rs/libtmux-macros"
readme = "README.md"
keywords = ["tmux", "derive", "macros", "filter", "query"]
categories = ["development-tools::procedural-macro-helpers", "api-bindings"]
repository.workspace = true
license.workspace = true
include = [
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/**/*.stderr",
]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.0"
proc-macro2 = "1.0.91"
quote = "1.0.35"
syn = "3.0"

[dev-dependencies]
# Renamed on purpose: every UI test then proves the derive resolves the crate
# through `proc-macro-crate` rather than assuming it is called `libtmux`. It
# is why this crate's own doctests cannot say `libtmux`, and why the README's
# example is compiled from the `libtmux` crate instead.
renamed_libtmux = { package = "libtmux", path = "../libtmux", features = ["derive"] }
trybuild = "1.0.116"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
