[package]
name = "libtmux-tokio"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Async typed tmux client and object model (alpha)"
documentation = "https://docs.rs/libtmux-tokio"
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["tmux", "terminal", "multiplexer", "async", "tokio"]
categories = ["api-bindings", "asynchronous", "os::unix-apis"]
include = [
    "/assets/*",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/docs/design.md",
    "/docs/findings.md",
    "/docs/migration.md",
    "/docs/parity.md",
    "/docs/packages.md",
    "/benches/**/*.rs",
    "/examples/**/*.rs",
    "/examples/api/*.json",
    "/examples/api/*.md",
    "/examples/api/*.toml",
    "/schema/**/*.json",
    "/src/**/*.rs",
    "/tests/fixtures/filter-v1/*.json",
    "/tests/fixtures/dialect-v1/*.json",
    "/tests/fixtures/layout-preflight.json",
    "/tests/**/*.rs",
]

[lib]
path = "src/lib.rs"

[[example]]
name = "inspect"

[[example]]
name = "scratch"
required-features = ["test-support"]

# An example needs a `main`, so it is skipped by cargo rather than emptied by
# a file-level cfg the way the filter test binaries are.
[[example]]
name = "find"
required-features = ["query"]

[[example]]
name = "api_construction"

[[example]]
name = "api_listings"

[[example]]
name = "api_creation"

[[example]]
name = "api_query"
required-features = ["query"]

[[example]]
name = "api_cardinality"
required-features = ["query"]

[[example]]
name = "api_input"

[[example]]
name = "api_capture"

# The matrix compares the transports against each other, so it needs one of
# each rather than a subset.
[[example]]
name = "sweep"
required-features = ["test-support"]

# Control mode is the whole point of this one, and the socket comes from the
# test helpers rather than from whatever the reader is attached to.
[[example]]
name = "watch"
required-features = ["control-mode", "test-support"]

[[example]]
name = "matrix"
required-features = ["plan", "control-mode", "blocking", "test-support", "query"]

# Only for `unique_name`, so the jobs and their channels cannot collide with
# another run on the same server. The waiting it demonstrates needs no feature.
[[example]]
name = "orchestrate"
required-features = ["test-support"]

# Same: `unique_name` only. Telling the failures apart needs no feature.
[[example]]
name = "recover"
required-features = ["test-support"]

[[bench]]
name = "hierarchy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "waits"
harness = false
required-features = ["test-support", "control-mode"]

[[test]]
name = "filter_derive"
path = "tests/filter_derive.rs"
required-features = ["derive"]

[[test]]
name = "filter_serde"
path = "tests/filter_serde.rs"

[features]
default = ["query"]
full = ["blocking", "control-mode", "derive", "plan", "query", "schema", "serde", "tracing"]
blocking = ["libtmux/blocking"]
control-mode = ["libtmux/control-mode"]
derive = ["libtmux/derive"]
plan = ["libtmux/plan"]
query = ["libtmux/query"]
schema = ["libtmux/schema"]
serde = ["libtmux/serde"]
test-support = ["libtmux/test-support"]
tracing = ["libtmux/tracing"]
unstable-fuzzing = ["libtmux/unstable-fuzzing"]

[dependencies]
libtmux = { path = "../libtmux", version = "=0.1.0-alpha.15", default-features = false }
futures-util = "0.3"
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
tracing = "0.1.36"
schemars.workspace = true
serde.workspace = true
rustix = { version = "1.1.4", features = ["process"] }
criterion = { version = "0.7.0", features = ["async_tokio"] }
futures-core = "0.3"
jsonschema.workspace = true
serde_json.workspace = true
static_assertions = "1.1.0"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tracing-subscriber = "0.3.23"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
