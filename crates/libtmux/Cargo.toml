[package]
name = "libtmux"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed tmux operations with native blocking and Tokio clients"
documentation = "https://docs.rs/libtmux"
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["tmux", "terminal", "multiplexer", "blocking", "tokio"]
categories = ["api-bindings", "asynchronous", "os::unix-apis"]
include = [
    "/assets/*",
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/docs/adr/*.md",
    "/docs/design.md",
    "/docs/migration.md",
    "/examples/**/*.rs",
    "/examples/api/*.json",
    "/examples/api/*.toml",
    "/src/**/*.rs",
]

[features]
default = ["blocking"]
blocking = ["dep:libtmux-blocking"]
tokio = ["dep:libtmux-tokio"]
control-mode = ["libtmux-blocking?/control-mode", "libtmux-tokio?/control-mode"]
derive = ["libtmux-core/derive", "query", "libtmux-tokio?/derive"]
plan = ["libtmux-core/plan", "libtmux-tokio?/plan"]
query = ["libtmux-core/query", "libtmux-tokio?/query"]
schema = ["serde", "libtmux-core/schema", "libtmux-tokio?/schema"]
serde = ["libtmux-core/serde", "libtmux-tokio?/serde"]
test-support = ["tokio", "libtmux-tokio/test-support"]
tracing = ["libtmux-tokio?/tracing"]
full = ["blocking", "tokio", "control-mode", "derive", "plan", "query", "schema", "serde", "tracing"]

[dependencies]
libtmux-blocking = { workspace = true, optional = true }
libtmux-core.workspace = true
libtmux-tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "api_mixed"
required-features = ["blocking", "tokio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
