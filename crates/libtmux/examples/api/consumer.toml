[package]
name = "libtmux-mixed-example"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
exclude = ["libtmux-source"]

[dependencies]
libtmux = { path = "libtmux-source/crates/libtmux", default-features = false, features = ["blocking", "tokio"] }
tokio = { version = "1.40", features = ["rt", "time"] }
