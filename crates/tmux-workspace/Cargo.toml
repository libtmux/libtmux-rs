[package]
name = "tmux-workspace"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build tmux workspaces from tmuxp-style YAML using libtmux (alpha)"
documentation = "https://docs.rs/tmux-workspace"
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["tmux", "tmuxp", "workspace", "yaml", "terminal"]
categories = ["command-line-utilities", "config", "os::unix-apis"]
include = [
    "/Cargo.toml",
    "/build.rs",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/libtmux-macros-README.md",
    "/src/**/*.rs",
    "/src/cli/bridge.py",
    "/tests/**/*.rs",
    "/tests/fixtures/tmuxp/*",
    "/tests/fixtures/layout-preflight.json",
    "/tests/fixtures/terminal_lifecycle.py",
]

[dependencies]
libtmux = { workspace = true, features = ["plan"] }
thiserror.workspace = true
yaml-rust2 = "0.13.0"
clap = { version = "4.6.6", optional = true, features = ["env", "string"] }
clap_complete = { version = "4.6.9", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
serde_json = { workspace = true, optional = true }
regex = { version = "1.13", optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "time"] }
tempfile = { workspace = true, optional = true }
rustix = { version = "1.1.4", optional = true, features = ["fs", "process", "termios"] }
anstyle-parse = { version = "1.0.0", optional = true, features = ["core"] }
unicode-width = { version = "0.2.2", optional = true, default-features = false }
unicode-segmentation = { version = "1.12.0", optional = true }

[target.'cfg(not(any(target_os = "cygwin", target_os = "emscripten", target_os = "fuchsia", target_os = "horizon", target_os = "netbsd", target_os = "openbsd", target_os = "redox", target_os = "wasi")))'.dependencies]
nix = { workspace = true, optional = true }

[features]
default = []
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:serde_json", "dep:regex", "dep:tokio", "dep:tempfile", "dep:rustix", "dep:nix", "dep:anstyle-parse", "dep:unicode-width", "dep:unicode-segmentation"]

[[bin]]
name = "tmux-workspace"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
libtmux = { workspace = true, features = ["control-mode", "derive", "test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
