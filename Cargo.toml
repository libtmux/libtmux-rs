[workspace]
members = ["crates/*"]
# Nightly-only and needs a sanitizer linker flag, so it is not a member.
exclude = ["fuzz"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.7"
authors = ["libtmux contributors"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libtmux/libtmux-rs"

# Shared dependency versions. A crate names the features it needs; the
# version lives here so a bump is one edit rather than one per crate.
[workspace.dependencies]
libtmux = { path = "crates/libtmux", version = "0.1.0-alpha.7" }
# Exact, not caret. The derive expands to paths into a hidden core surface, so
# a macro from one release paired with a core from another is not a
# combination anyone has tested. They move together or not at all.
libtmux-macros = { path = "crates/libtmux-macros", version = "=0.1.0-alpha.7" }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.20"
thiserror = "2.0"
tokio = "1.40"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("cygwin"))'] }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A library returns errors; it does not decide to end the caller's process.
# clippy.toml exempts test code, which asserts instead.
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
# Deadlock shapes, in a crate whose whole surface is async.
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
