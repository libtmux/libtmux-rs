[package]
name = "split-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libtmux.workspace = true
libtmux-tokio = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }

[features]
live = ["dep:libtmux-tokio", "dep:tokio"]

[[bin]]
name = "offline"
path = "src/offline.rs"

[[bin]]
name = "live"
path = "src/live.rs"
required-features = ["live"]

[lints]
workspace = true
