# Everything Cargo launches -- tests, doctests, examples, `cargo run` -- gets
# no inherited tmux server and a private default socket directory.
# CONTRIBUTING.md, "Nothing selects a server", says why and how to opt out.
[env]
TMUX = { value = "", force = true }
TMUX_PANE = { value = "", force = true }
TMUX_TMPDIR = { value = ".cargo/tmux-sandbox", relative = true, force = true }
LIBTMUX_TEST_SANDBOX = { value = ".cargo/tmux-sandbox", relative = true, force = true }
