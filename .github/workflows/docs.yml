name: docs

# Publishes this port's documentation to libtmux.org: trunk as
# /en/rs/latest/, and each `libtmux@v*` release tag as its own version plus an
# alias, `next` for a prerelease and `stable` (the default) for a release.
#
# libtmux/docs builds and publishes the tree, through two reusable workflows
# pinned to one commit: port-docs.yml decides which versions an event builds
# and builds each from this repository's source, and reusable-deploy.yml
# publishes them. Bump both pins together.

on:
  pull_request:
  push:
    branches: [master]
    tags: ['libtmux@v*']
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact source ref to build
        required: true
        default: master
      version:
        description: URL version slug
        required: true
        default: latest
      version-kind:
        description: Version policy
        required: true
        type: choice
        options: [trunk, tag, alias]
        default: trunk
      is-default:
        description: Make this version canonical
        required: true
        type: boolean
        default: false
      resolves-to:
        description: Immutable target for an alias
        required: false
        default: ''
      publish:
        description: Publish after the exact build passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A pull request builds `latest` without publishing; this port has no
  # preview role.
  build:
    uses: libtmux/docs/.github/workflows/port-docs.yml@863d4420b75561ea5e0f5aa5da1412e75b4817d4
    with:
      port: rs
      tag-prefix: libtmux@
      source-ref: ${{ inputs.source-ref }}
      version: ${{ inputs.version }}
      version-kind: ${{ inputs.version-kind }}
      is-default: ${{ inputs.is-default == true }}
      resolves-to: ${{ inputs.resolves-to }}
      publish: ${{ inputs.publish == true }}

  # One publication to this port's prefixes at a time, a tag's two legs
  # included: both rewrite manifest/rs.json. Only publishing queues; a pull
  # request's build never waits behind a deploy. `max`, so a queued tag is
  # never dropped for a newer run.
  publish:
    needs: build
    if: needs.build.outputs.should-publish == 'true'
    concurrency:
      group: docs-deploy-${{ github.repository }}
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: libtmux/docs/.github/workflows/reusable-deploy.yml@863d4420b75561ea5e0f5aa5da1412e75b4817d4
    with:
      # Unprefixed by locale: reusable-deploy prepends <locale>/ itself when
      # `port` is set, so this becomes en/rs/<version>.
      path-prefix: rs/${{ matrix.version }}
      artifact: docs-rs-${{ matrix.version }}
      version-kind: ${{ matrix.kind }}
      port: rs
      version: ${{ matrix.version }}
      label: ${{ matrix.version }}
      is-default: ${{ matrix.isDefault }}
      resolves-to: ${{ matrix.resolvesTo }}
      environment: docs
    secrets:
      role-arn: ${{ secrets.LIBTMUX_DOCS_ROLE_ARN }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}
