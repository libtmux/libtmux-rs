name: standard-library core demo

on:
  pull_request:
    paths:
      - 'experiments/standard-library-core/**'
      - '.github/workflows/standard-library-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.97.1'
          components: clippy, rustfmt
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tmux
      - name: Run offline and live consumers
        env:
          LIBTMUX_TEST_TMUX: /usr/bin/tmux
        run: |
          "$LIBTMUX_TEST_TMUX" -V
          bash experiments/standard-library-core/check.sh
