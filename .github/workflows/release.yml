name: Release

# One tag names one crate: `libtmux@v0.1.0-alpha.4`. The crates do not share a
# version -- `tmux-mcp` moves at its own pace -- so a single workspace-wide tag
# could not say what was being released.
#
# It also orders the work. Publishing `tmux-mcp` before the `libtmux` it
# requires simply fails, because cargo resolves the dependency from the
# registry, so the tags have to go out leaves-first and each one waits for the
# previous to land.
on:
  push:
    tags: ['*@v*']
  workflow_dispatch:

# Nothing is granted by default; each job asks for exactly what it uses.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # tmux emits bytes rather than text, and the fixtures assert on wording.
  LC_ALL: C.UTF-8

jobs:
  # A tag is not evidence. The same gate CI runs has to pass on the exact
  # commit being published, because a release is the one build nobody can take
  # back: a crates.io version is immutable.
  verify:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `just msrv` reaches for these by exact name through `rustup run`.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack,cargo-deny

      - uses: Swatinem/rust-cache@v2

      - run: just check

  publish:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Trusted publishing names an environment as well as a workflow, so this is
    # load-bearing rather than decorative: a workflow running outside it cannot
    # mint a token, whatever else it can reach.
    environment: release
    permissions:
      # Mint the OIDC token crates.io exchanges for a short-lived publish
      # token. No API token is stored anywhere.
      id-token: write
      # Attach the packaged crate and its provenance to a GitHub release.
      contents: write
      # Persist the SLSA build provenance attestation.
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The tag is an assertion about the tree, and an assertion is worth
      # checking: a tag naming a version the manifest does not carry would
      # otherwise publish whatever the manifest happens to say.
      - name: Read the crate and version out of the tag
        id: target
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *@v*) ;;
            *) printf 'tag %s is not <crate>@v<version>\n' "$TAG" >&2; exit 1 ;;
          esac
          package="${TAG%@v*}"
          version="${TAG##*@v}"

          manifest="$(
            cargo metadata --format-version 1 --no-deps \
              | jq -r --arg p "$package" '.packages[] | select(.name == $p) | .version'
          )"
          if [ -z "$manifest" ]; then
            printf 'no workspace member is called %s\n' "$package" >&2
            exit 1
          fi
          if [ "$manifest" != "$version" ]; then
            printf '%s is %s in the manifest, but the tag says %s\n' \
              "$package" "$manifest" "$version" >&2
            exit 1
          fi

          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'crate_file=target/package/%s-%s.crate\n' "$package" "$version" >> "$GITHUB_OUTPUT"

      # Package first, so the artifact that gets attested is built once and is
      # the one a reader can check.
      - name: Package
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
        run: cargo package --package "$PACKAGE" --locked

      # crates.io does not host or verify provenance yet, and cargo does not
      # check it, so this attests the packaged `.crate` on the release instead.
      # It is real -- Sigstore-signed, logged in Rekor -- just not surfaced by
      # the registry. It covers the bytes crates.io serves, because
      # `cargo package` is byte-deterministic for a given tree.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.target.outputs.crate_file }}

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          PACKAGE: ${{ steps.target.outputs.package }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --package "$PACKAGE" --locked --no-verify

      - name: Attach the crate to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.target.outputs.version }}
          CRATE_FILE: ${{ steps.target.outputs.crate_file }}
        # Idempotent, because `workflow_dispatch` exists to retry a publish
        # that failed partway, and a release created by the first attempt would
        # otherwise stop the second before it uploaded anything.
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$CRATE_FILE" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PACKAGE $VERSION" \
              --notes "\`$PACKAGE\` $VERSION. See CHANGELOG.md for what changed. This is a prerelease." \
              --prerelease \
              --verify-tag \
              "$CRATE_FILE"
          fi
