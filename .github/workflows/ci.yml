name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The fuzz lane is the only scheduled work. A parser is worth re-fuzzing
  # because the corpus grows, not because the code changed.
  schedule:
    - cron: "37 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # tmux emits bytes rather than text, and the fixtures assert on wording.
  LC_ALL: C.UTF-8

jobs:
  # Everything `just check` runs: formatting, Clippy, tests, doctests, docs,
  # the feature powerset, cargo-deny, both MSRV floors, and packaging.
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `just msrv` invokes these by exact name via `rustup run`. Two floors,
      # because they are two promises: the libraries support 1.85, and
      # tmux-mcp cannot, since its dependencies require 1.88.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack,cargo-deny

      - uses: Swatinem/rust-cache@v2

      - run: just check

  # tmux's habitat is not only Linux, and the parts most likely to differ are
  # exactly the ones this crate leans on: process groups, Unix sockets,
  # `waitid`, and temporary paths. Scoped to the test suite rather than the
  # whole gate, and to master rather than every push, because a macOS runner
  # bills at ten times a Linux one and the lints are platform-independent.
  macos:
    name: tests on macOS
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked --workspace --all-targets --all-features

  # A short fuzz pass over the parsers that read from outside the process. Kept
  # brief and off the pull-request path: this finds things by running for a
  # long time, so a weekly schedule is worth more than a gate nobody can wait
  # for.
  fuzz:
    name: fuzz parsers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [control_line, filter_expr_json, workspace_yaml]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo fuzz run "$TARGET" "fuzz/seeds/$TARGET" \
            -- -max_total_time=300 -rss_limit_mb=4096
      - name: Keep any crash that was found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  # The slow lane. tmux's output and error wording change between releases, so
  # every supported one is built from source and runs the whole workspace.
  compat:
    name: tmux compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison \
            build-essential \
            libevent-dev \
            libncurses-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2

      - run: just compat
