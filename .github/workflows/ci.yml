name: CI

# A push or pull request builds the oldest and the newest supported tmux. The
# weekly schedule and a dispatch with scope=full build every lane in
# .github/ci-matrix.txt. scripts/ci-plan/ci_plan.py decides, and the
# compatibility job takes its matrix from that plan.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: edges builds the oldest and newest tmux, full every lane, custom the tmux-ref list
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: With scope=custom, comma-separated tmux versions, tags, branches or commits
        type: string
        default: ""
      rust-toolchain:
        description: Comma-separated toolchains for the compatibility jobs; empty keeps rust-toolchain.toml
        type: string
        default: ""
      os:
        description: Runner image for the compatibility jobs
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-latest
      tmate:
        description: Open a tmate session on the one compatibility lane, which needs a single tmux-ref
        type: choice
        options: ['off', before-tests, on-failure]
        default: "off"
  # Scheduled weekly, whether or not the code changed: a parser is worth
  # re-fuzzing as its corpus grows, and a benchmark is compared with the
  # previous week's.
  schedule:
    - cron: "37 4 * * 1"

# A dispatch is a request for that run, so its run id keeps one from cancelling
# another or the push run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # tmux emits bytes rather than text, and the fixtures assert on wording.
  LC_ALL: C.UTF-8

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      os: ${{ steps.plan.outputs.os }}
      periodic: ${{ steps.plan.outputs.periodic }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: uv

      # Inputs reach the script through the environment, never inline.
      - name: Plan the tmux lanes
        id: plan
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_TMUX_REF: ${{ inputs.tmux-ref }}
          INPUT_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_TMATE: ${{ inputs.tmate }}
        run: uv run scripts/ci-plan/ci_plan.py

  # One check to require. A job the plan left out of scope may be skipped; every
  # other job has to have passed. The matrix shrinks through the plan, not
  # through an `if` on a leg, so a skipped leg cannot read as a pass.
  required:
    name: required
    if: ${{ always() }}
    needs: [plan, check, api, fuzz, bench, python-bridge, compat, native-clients]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: uv

      - name: Require every planned job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ${{ needs.plan.outputs.skip }}
        run: uv run scripts/ci-plan/ci_plan.py verify

  native-clients:
    name: Native Rust clients
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends tmux
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      - uses: taiki-e/install-action@v2
        with:
          tool: uv
      - name: Exercise shared operations on an isolated daemon
        run: cargo test --locked -p libtmux-tokio --all-features --test shared_operations --test parked_channels
      - name: Exercise native process registration and cleanup
        run: cargo test --locked -p libtmux-tokio --all-features --lib internal::subprocess::tests::typed_
      - name: Check out the shared native recorder
        uses: actions/checkout@v7
        with:
          repository: libtmux/docs
          ref: f2e7244263b4e7ee2185b46dc91e43416625a9a1
          path: .native-proof-docs
          sparse-checkout: scripts/example_tmux_sandbox.py
          sparse-checkout-cone-mode: false
      - name: Run independent readers and installed applications against staged crates
        run: uv run scripts/check-package-contents/installed_clients.py --recorder .native-proof-docs/scripts/example_tmux_sandbox.py --output-dir artifacts/native-clients
      - name: Retain archive and native capture provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-clients-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native-clients
          if-no-files-found: warn

  # Everything `just check` runs: formatting, Clippy, tests, doctests, docs,
  # the feature powerset, cargo-deny, both MSRV floors, and packaging.
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends tmux

      - run: tmux -V

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt
          build-warnings: ""
          cache-bin: false

      # `just msrv` invokes these by exact name via `rustup run`. Two floors,
      # because they are two promises: the libraries support 1.85, and
      # tmux-mcp cannot, since its dependencies require 1.88.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: "1.85.0,1.88.0"
          override: false
          cache: false
          build-warnings: ""

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack,cargo-deny,uv

      - run: just check

  # A semver gate applies from 0.1.0 on, and none runs here yet. Through the
  # alphas `cargo-semver-checks` skipped every lint on a prerelease-to-
  # prerelease step and then reported success. A 0.1.N release may break the
  # API, so this does not judge whether a change is allowed, it says one
  # happened, which is what review needs.
  api:
    name: public API surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: nightly
          override: false
          build-warnings: ""
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,uv
      - run: just api-check
      # Same toolchain and the same rustdoc JSON, so it rides along here
      # rather than paying for a second nightly build.
      - run: just example-coverage-check

  # A short fuzz pass over the parsers that read from outside the process. Kept
  # brief and off the pull-request path: this finds things by running for a
  # long time, so a weekly schedule is worth more than a gate nobody can wait
  # for.
  fuzz:
    name: fuzz parsers
    needs: plan
    if: needs.plan.outputs.periodic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - control_block
          - control_line
          - environment_listing
          - filter_expr_json
          - format_rows
          - text_filter
          - list_keys
          - workspace_yaml
          - layout
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: nightly
          override: false
          build-warnings: ""
          cache-bin: false
      # cargo-fuzz runs the target through the Cargo runner, which `uv` runs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,uv
      # The corpus is what this job grows. Cache entries are immutable, so each
      # run saves under its own key and the next restores the newest by prefix.
      # An entry unused for seven days is evicted: a late run restarts from seeds.
      - name: Restore the ${{ matrix.target }} corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: uv run scripts/fuzz-run/fuzz_run.py "$TARGET"
      - name: Save the ${{ matrix.target }} corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Keep any crash that was found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  # Timing on a shared runner is too noisy to gate a pull request on, so this
  # runs weekly against the previous run's numbers, kept in the cache, and fails
  # only when a benchmark more than doubles: the size of an algorithmic
  # regression, not of a noisy neighbour. Every change is in the job summary.
  bench:
    name: benchmarks
    needs: plan
    if: needs.plan.outputs.periodic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends tmux

      - run: tmux -V

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""

      - uses: taiki-e/install-action@v2
        with:
          tool: uv

      - name: Restore the previous run
        uses: actions/cache/restore@v6
        with:
          path: target/criterion
          key: bench-criterion-${{ github.run_id }}
          restore-keys: bench-criterion-

      - name: Benchmark the hierarchy
        run: cargo bench --locked --package libtmux-tokio --features test-support --bench hierarchy

      - name: Benchmark the waits
        run: cargo bench --locked --package libtmux-tokio --features test-support,control-mode --bench waits

      - name: Compare with the previous run
        run: uv run scripts/bench-regressions/bench_regressions.py target/criterion

      # Only a run that passed becomes the baseline. Saving a regressed one
      # would make it next week's normal, and the regression would fail once.
      - name: Keep this run for the next
        uses: actions/cache/save@v6
        with:
          path: target/criterion
          key: bench-criterion-${{ github.run_id }}

  python-bridge:
    name: workspace Python version check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      TOKIO_WORKER_THREADS: "2"
      # Cases gated on these fail instead of skipping when a step above
      # did not export them.
      LIBTMUX_REQUIRE_NATIVE: LIBTMUX_TEST_MINIMUM_TMUX,LIBTMUX_TEST_OBSOLETE_PYTHON,LIBTMUX_TEST_QUALIFIED_PYTHON
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tmux-python/libtmux
          ref: 93eab7341f7dac39c7706f88cc3512c855dfcab2
          path: .bridge-python

      - name: Install tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes --no-install-recommends tmux

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: uv

      # The commit is tmux 3.3a, the oldest release the workspace supports. The
      # action builds it, checks it and caches the build.
      - name: Build the minimum daemon
        id: minimum
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: 0b355ae8114511e1ff6359272b164f1cdf718e80

      - name: Select the minimum daemon
        env:
          MINIMUM_TMUX: ${{ steps.minimum.outputs.binary }}
        run: printf 'LIBTMUX_TEST_MINIMUM_TMUX=%s\n' "$MINIMUM_TMUX" >> "$GITHUB_ENV"

      - name: Make the venv for the obsolete Python backend
        run: uv venv "$RUNNER_TEMP/bridge-venv"

      - name: Install the obsolete tmuxp
        run: uv pip install --python "$RUNNER_TEMP/bridge-venv/bin/python" 'tmuxp==1.74.0'

      - name: Name the obsolete and qualified Python backends
        run: uv run scripts/bridge-python/bridge_python.py

      - name: Qualify the extension version checks
        env:
          TMUX_WORKSPACE_PYTHON: ${{ env.LIBTMUX_TEST_QUALIFIED_PYTHON }}
        run: >-
          uv run scripts/require-tests/require_tests.py
          cargo test --locked --package tmux-workspace --all-features
          --bin tmux-workspace cli::bridge::tests -- --include-ignored --test-threads=1

      - name: Qualify the Python version check of the workspace CLI
        env:
          TMUX_WORKSPACE_PYTHON: ${{ env.LIBTMUX_TEST_QUALIFIED_PYTHON }}
        run: >-
          uv run scripts/require-tests/require_tests.py
          cargo test --locked --package tmux-workspace --all-features
          --test cli python_ -- --include-ignored --test-threads=1

  # The slow lane. tmux's output and error wording change between releases, so
  # each lane builds its release from source and runs the whole workspace, or
  # proves a refusal. A push builds the oldest and the newest; the schedule and
  # scope=full build every lane in the manifest.
  compat:
    name: tmux compatibility (${{ matrix.name }})
    needs: plan
    runs-on: ${{ needs.plan.outputs.os }}
    permissions:
      contents: read
    # A tmate session needs longer than a lane does.
    timeout-minutes: ${{ matrix.tmate == 'off' && 90 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux build dependencies
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: >-
            install --yes --no-install-recommends
            bison build-essential libevent-dev libncurses-dev pkg-config

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          build-warnings: ""
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,uv

      - name: Open a tmate session before the tests
        if: ${{ matrix.tmate == 'before-tests' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true

      # rustup reads an empty RUSTUP_TOOLCHAIN as unset, so an empty toolchain
      # keeps what rust-toolchain.toml pins, which the compile-fail cases need,
      # and a named one overrides it.
      - name: Build and test the lane
        env:
          LIBTMUX_COMPAT_LANES: ${{ matrix.lane }}
          RUSTUP_TOOLCHAIN: ${{ matrix.rust-toolchain }}
        run: just compat

      - name: Open a tmate session after a failure
        if: ${{ failure() && matrix.tmate == 'on-failure' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true
